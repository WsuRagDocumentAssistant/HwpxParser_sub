#================================================
# pyproject.toml
#
# hwpx 패키지 빌드 설정.
#
# 무엇이 담기고 무엇이 안 담기나
#   담김   hwpx/            라이브러리 (analysis · parser · document · runner)
#   안 담김 tools/          이 저장소의 개발 도구. 회귀 검증·가드·감사 도구라
#                          라이브러리를 가져다 쓰는 쪽이 설치할 이유가 없다.
#           main.py         쓰는 쪽 코드 예시. 복사해 가는 것이지 설치물이 아니다.
#           output/ docs/   산출물과 문서
#
#   tools 를 빼는 것이 중요하다. 그대로 두면 설치할 때 tools 라는 최상위
#   이름을 점유하는데, 흔한 이름이라 다른 패키지와 부딪히면 먼저 import 된
#   쪽이 이기고 나머지는 조용히 가려진다.
#
# 담긴 것이 실제로 자립하는지는 tools/check_standalone.py 로 확인한다.
# hwpx 만 빈 폴더에 복사해 문서 하나를 끝까지 돌려 본다.
#================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpx"
version = "0.1.0"
description = "HWPX 문서를 파싱해 조립이 끝난 문서 객체로 만든다"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# 외부 의존이 없다. 표준 라이브러리만 쓴다(측정으로 확인).
dependencies = []

[project.urls]
Documentation = "docs/DOCUMENT_MODEL_GUIDE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hwpx*"]

[tool.setuptools.package-data]
# 지금은 패키지 안에 데이터 파일이 없다. 생기면 여기에 적는다.
hwpx = []
